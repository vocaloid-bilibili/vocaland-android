name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name, for example 1.2.3"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          VERSION_NAME="$INPUT_VERSION_NAME"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "VocaLand-${VERSION_NAME}.apk"
          ls -lh VocaLand-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: VocaLand-${{ steps.version.outputs.name }}
          path: VocaLand-*.apk
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: VocaLand ${{ steps.version.outputs.name }}
          draft: true
          generate_release_notes: true
          files: VocaLand-*.apk
